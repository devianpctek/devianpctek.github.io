  <style>
    @font-face {
      font-family: "Ruda";
      src: url("Ruda-Bold.ttf") format("truetype");
      font-weight: 700;
      font-style: normal;
      font-display: swap;
    }

    :root {
      --black: #000000;
      --twine: #C6935E;
      --graphite: #424242;
      --pink: #F2C0C9;
      --white: #ffffff;
      --muted: #b9b9b9;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at 50% -20%,
          #303030 0%,
          #151515 28%,
          var(--black) 62%);
      color: var(--white);
      font-family: "Ruda", Arial, sans-serif;
      display: flex;
      justify-content: center;
    }

    .page {
      width: 100%;
      max-width: 560px;
      padding: 45px 22px 35px;
      text-align: center;
    }

    .logo {
      width: 180px;
      max-width: 48vw;
      height: auto;
      margin-bottom: 15px;
    }

    h1 {
      margin: 3px 0 5px;
      font-size: 1.75rem;
      letter-spacing: 2px;
    }

    .tagline {
      color: var(--twine);
      font-size: 0.92rem;
      letter-spacing: 1px;
      margin: 0 0 8px;
    }

    .description {
      color: var(--muted);
      font-family: Arial, sans-serif;
      font-size: 0.91rem;
      line-height: 1.5;
      margin: 0 auto 32px;
      max-width: 400px;
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .link {
      position: relative;
      min-height: 67px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px 54px;
      border-radius: 14px;
      text-decoration: none;
      color: var(--white);
      background: rgba(66, 66, 66, 0.78);
      border: 1px solid rgba(255,255,255,.12);
      transition:
        transform .18s ease,
        border-color .18s ease,
        background .18s ease;
    }

    .link:hover {
      transform: translateY(-2px);
      border-color: var(--twine);
      background: #4a4a4a;
    }

    .link:active {
      transform: scale(.985);
    }

    .link.primary {
      color: var(--black);
      background: var(--twine);
      border-color: var(--twine);
    }

    .link.primary:hover {
      background: #d0a06d;
    }

    .icon {
      position: absolute;
      left: 20px;
      width: 27px;
      height: 27px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .icon svg {
      width: 100%;
      height: 100%;
      fill: currentColor;
    }

    .label {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .title {
      font-size: 0.97rem;
      letter-spacing: .8px;
    }

    .subtitle {
      font-family: Arial, sans-serif;
      font-size: .77rem;
      font-weight: normal;
      opacity: .68;
    }

    .accent {
      width: 46px;
      height: 3px;
      border-radius: 20px;
      background: var(--pink);
      margin: 34px auto 20px;
    }

    footer {
      color: #777;
      font-family: Arial, sans-serif;
      font-size: .76rem;
      line-height: 1.7;
    }

    footer strong {
      color: var(--twine);
      font-family: "Ruda", Arial, sans-serif;
      letter-spacing: .5px;
    }

    @media (max-width: 420px) {
      .page {
        padding-top: 30px;
      }

      .logo {
        width: 155px;
      }

      h1 {
        font-size: 1.55rem;
      }

      .link {
        min-height: 64px;
      }
    }
  </style>
</head>
